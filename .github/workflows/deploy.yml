name: Production Deployment

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, mbstring

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          script: |
            cd /var/www/enegence

            # 1. Put application in maintenance mode (fails silently on first run)
            docker compose -f docker-compose.prod.yml exec -T app php artisan down || true

            # 2. Pull the latest code
            git pull origin master

            # 3. Rebuild the application image
            docker compose -f docker-compose.prod.yml build app

            # 4. Restart containers with the newly built image
            docker compose -f docker-compose.prod.yml up -d

            # 5. Run database migrations
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            # 6. Bring application back online
            docker compose -f docker-compose.prod.yml exec -T app php artisan up

